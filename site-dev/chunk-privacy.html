<!doctype html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chunk: where your words go</title>
<link rel="stylesheet" href="../site/css/site.css">
<link rel="stylesheet" href="../site/css/kbd.css">
<link rel="stylesheet" href="../site/css/chunks/privacy.css">
<style>
  /* This page only: the same key on a six-unit board, on the narrowest board that keeps it 3u, and at a phone's width. */
  .bench { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-7); }
  .bench h2 { margin-bottom: var(--s-4); font-size: var(--t-tiny); font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
  .bench__tight { max-width: 904px; }
  .bench__phone { max-width: 320px; }
</style>
</head>
<body>
<main class="wrap section section--tight bench">
  <section aria-labelledby="wide">
    <h2 id="wide">On the board: 3u</h2>
    <div class="keycaps">
      <div class="keycaps__row keycaps__row--start">
        <article class="keycap keycap--3u">
          <div class="keycap__face">
            <h3 class="keycap__legend">privacy</h3>
            <span class="keycap__hint">no server in between</span>
            <div class="keycap__body" data-chunk="privacy"></div>
          </div>
        </article>
      </div>
    </div>
  </section>

  <section aria-labelledby="tight">
    <h2 id="tight">The narrowest 3u: a 904px board</h2>
    <div class="keycaps bench__tight">
      <div class="keycaps__row keycaps__row--start">
        <article class="keycap keycap--3u">
          <div class="keycap__face">
            <h3 class="keycap__legend">privacy</h3>
            <span class="keycap__hint">no server in between</span>
            <div class="keycap__body" data-chunk="privacy"></div>
          </div>
        </article>
      </div>
    </div>
  </section>

  <section aria-labelledby="narrow">
    <h2 id="narrow">On a phone: one column, 320px</h2>
    <div class="keycaps bench__phone">
      <div class="keycaps__row">
        <article class="keycap keycap--3u">
          <div class="keycap__face">
            <h3 class="keycap__legend">privacy</h3>
            <span class="keycap__hint">no server in between</span>
            <div class="keycap__body" data-chunk="privacy"></div>
          </div>
        </article>
      </div>
    </div>
  </section>
</main>

<script type="module">
import { mount } from '../site/js/chunks/privacy.js';
window.chunks = [...document.querySelectorAll('[data-chunk="privacy"]')].map((el) => mount(el));
</script>
</body>
</html>
