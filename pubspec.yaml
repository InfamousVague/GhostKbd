name: dev_keyboard
description: "Ghost Keyboard: a developer-centric keyboard for Android. The keyboard is a native InputMethodService; this Flutter app is its walkthrough, settings and plugin Market, drawn with Glacier and Ghost.md's settings kit."
publish_to: 'none'
version: 0.4.9+19

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # The Glacier UI kit in Flutter, vendored from Ghost.md (packages/glacier/VENDORED.md).
  glacier:
    path: packages/glacier

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    # Ghost.md's stylesheets, read by the token engine over Glacier's own (lib/main.dart).
    - assets/css/ink.css
    - assets/css/app.css
    # The walkthrough's voice (lib/onboarding/narration.dart, tool/onboarding_voice.py).
    - assets/onboarding/
  fonts:
    # The kit's faces (tokens.css --glacier-font-sans / --glacier-font-mono), OFL (assets/fonts/OFL.txt).
    - family: Inter Variable
      fonts:
        - asset: assets/fonts/InterVariable-latin.ttf
    - family: JetBrains Mono Variable
      fonts:
        - asset: assets/fonts/JetBrainsMonoVariable-latin.ttf
