# Every push to main: does it compile? `flutter analyze`, then a debug build (Kotlin, whisper.cpp's C++, Dart), with
# no secrets and no release. Releases are release.yml's, from the release branch.
name: Check

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Named, so a new stable cannot change a build on the day it comes out. 3.50.0 (2026-11-11) refused to
          # build until Android's Gradle plugin was raised past 9.1.0, and each Flutter brings its own Android
          # defaults. 3.47.9 built 0.14.0. Raise it on purpose, with the app tried on the new one first.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Debug build
        # Downloads that time out are tried again (see release.yml).
        run: |
          for attempt in 1 2 3; do
            flutter build apk --debug --target-platform android-arm64 && exit 0
            echo "::warning::Build attempt $attempt failed; trying again"; sleep $((attempt * 60))
          done
          exit 1
