# Every push to main: does it compile? `flutter analyze`, then a debug build (Kotlin, whisper.cpp's C++, Dart), with
# no secrets and no release. Releases are release.yml's, from the release branch.
name: Check

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Debug build
        run: flutter build apk --debug --target-platform android-arm64
