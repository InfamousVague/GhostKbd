# Builds and publishes a release (a push to the release branch, a tag vX.Y.Z, or Run workflow) to https://ghostkbd.com/ with tool/release.mjs, exactly as a release from
# the Mac does: Ghost.md's box.mjs and .env loader (from a checkout of the public glyph repo), the same box account,
# the same release key.
#
# Secrets (repository Actions secrets; repository variables of the same names are read too):
#   AFM_DEPLOY_HOST, AFM_DEPLOY_USER, AFM_DEPLOY_PASS   the box's account, as in glyph/tauri/.env
#   RELEASE_KEYSTORE_B64                                 ~/.config/devkeyboard/release.keystore, base64
#   RELEASE_KEY_PASSWORD                                 its store and key password
#   RELEASE_CERT_SHA256                                  the release certificate's pin (cert.sha256)
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name (blank keeps pubspec.yaml's)
        required: false
  # Releases are deliberate, not every push to main: `git push origin main:release` ships pubspec.yaml's version;
  # a tag `v0.2.0` ships 0.2.0.
  push:
    branches: [release]
    tags: ['v*']
  # New key sounds ship on their own: once the Sounds workflow has made and committed them, main is released.
  workflow_run:
    workflows: [Sounds]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # After Sounds only when it succeeded (it runs only when tool/sound_packs.py changes, so each run is meant).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The secrets live in the Prod environment.
    environment: Prod
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: dev-keyboard

      - name: Ghost.md's deploy code (box.mjs, the .env loader)
        uses: actions/checkout@v4
        with:
          repository: InfamousVague/glyph
          path: glyph
          sparse-checkout: |
            tauri/scripts/lib
            scripts/lib

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Gradle's downloads kept between runs, so a GitHub download hiccup (504s on 2026-11-09) can't stop a release.
          cache: gradle
          cache-dependency-path: |
            dev-keyboard/android/**/*.gradle*
            dev-keyboard/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Which secrets are set (lengths only)
        env:
          AFM_DEPLOY_HOST: ${{ secrets.AFM_DEPLOY_HOST || vars.AFM_DEPLOY_HOST }}
          AFM_DEPLOY_USER: ${{ secrets.AFM_DEPLOY_USER || vars.AFM_DEPLOY_USER }}
          AFM_DEPLOY_PASS: ${{ secrets.AFM_DEPLOY_PASS || vars.AFM_DEPLOY_PASS }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 || vars.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || vars.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 || vars.RELEASE_CERT_SHA256 }}
        run: |
          missing=0
          for name in AFM_DEPLOY_HOST AFM_DEPLOY_USER AFM_DEPLOY_PASS RELEASE_KEYSTORE_B64 RELEASE_KEY_PASSWORD RELEASE_CERT_SHA256; do
            value="${!name}"
            echo "$name: ${#value} characters"
            [ -n "$value" ] || { echo "::error::$name is not set as a repository secret or variable"; missing=1; }
          done
          exit $missing

      - name: sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: The box's account, where Ghost.md's loader reads it
        env:
          AFM_DEPLOY_HOST: ${{ secrets.AFM_DEPLOY_HOST || vars.AFM_DEPLOY_HOST }}
          AFM_DEPLOY_USER: ${{ secrets.AFM_DEPLOY_USER || vars.AFM_DEPLOY_USER }}
          AFM_DEPLOY_PASS: ${{ secrets.AFM_DEPLOY_PASS || vars.AFM_DEPLOY_PASS }}
        run: |
          umask 077
          printf 'AFM_DEPLOY_HOST=%s\nAFM_DEPLOY_USER=%s\nAFM_DEPLOY_PASS=%s\n' "$AFM_DEPLOY_HOST" "$AFM_DEPLOY_USER" "$AFM_DEPLOY_PASS" > glyph/tauri/.env
          mkdir -p ~/.ssh ~/Library/Logs && chmod 700 ~/.ssh

      - name: The release key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_B64 || vars.RELEASE_KEYSTORE_B64 }}
          PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || vars.RELEASE_KEY_PASSWORD }}
          PIN: ${{ secrets.RELEASE_CERT_SHA256 || vars.RELEASE_CERT_SHA256 }}
        run: |
          umask 077
          mkdir -p ~/.config/devkeyboard
          # Whitespace and line breaks a paste may add are dropped before decoding.
          printf '%s' "$KEYSTORE" | tr -d ' \n\r\t' | base64 -d > ~/.config/devkeyboard/release.keystore
          echo "keystore: $(wc -c < ~/.config/devkeyboard/release.keystore) bytes, sha256 $(sha256sum ~/.config/devkeyboard/release.keystore | cut -c1-16)…; secret was $(printf '%s' "$KEYSTORE" | tr -d ' \n\r\t' | wc -c) base64 characters"
          keytool -list -keystore ~/.config/devkeyboard/release.keystore -storepass "$PASSWORD" > /dev/null \
            || { echo "::error::RELEASE_KEYSTORE_B64 does not decode to a keystore RELEASE_KEY_PASSWORD opens (expected 4306 bytes, 5744 base64 characters)"; exit 1; }
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=devkeyboard\nkeyPassword=%s\n' "$HOME/.config/devkeyboard/release.keystore" "$PASSWORD" "$PASSWORD" > ~/.config/devkeyboard/signing.properties
          echo "$PIN" > ~/.config/devkeyboard/cert.sha256

      - name: Build and publish
        working-directory: dev-keyboard
        env:
          VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
          # The GIF plugin's GIPHY key (optional: without it the plugin asks for one in Settings).
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY || vars.GIPHY_API_KEY }}
        run: |
          VERSION="${VERSION#v}"
          # A download that times out (GitHub's release CDN answered 504 for hours on 2026-11-09) is tried again, up to
          # four times a few minutes apart; the build fails before anything is uploaded, so a retry starts clean.
          for attempt in 1 2 3 4; do
            if [ -n "$VERSION" ]; then
              node tool/release.mjs --glyph ../glyph --version "$VERSION" && exit 0
            else
              node tool/release.mjs --glyph ../glyph && exit 0
            fi
            echo "::warning::Release attempt $attempt failed; trying again in $((attempt * 90)) seconds"
            sleep $((attempt * 90))
          done
          exit 1

      - name: Forget the secrets
        if: always()
        run: rm -rf ~/.config/devkeyboard glyph/tauri/.env

      - uses: actions/upload-artifact@v4
        with:
          name: devkeyboard-apk
          path: dev-keyboard/build/release/
          retention-days: 30
